name: Repository hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test hygiene rules
        run: python -m unittest discover -s Java/tools/tests -p "test_repository_*.py"
      - name: Check repository layout
        run: python Java/tools/check_repository_hygiene.py
      - name: Check review links and quarantine integrity
        run: python Java/tools/check_review_site.py
      - name: Check tool imports and asset IDs
        run: python Java/tools/checks/check_structure.py
