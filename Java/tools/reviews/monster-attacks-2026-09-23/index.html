<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Monster attack review</title>
<style>
body{background:#20262e;color:#eee;font:16px system-ui;margin:28px}header{position:sticky;top:0;background:#20262ef5;padding:12px;z-index:1}h1{font-size:24px;margin:0 0 12px}button,input{margin-right:14px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:#343d47;border:1px solid #58616b;border-radius:10px;padding:14px}.sprite{width:256px;height:256px;background-size:3072px 256px;background-repeat:no-repeat;image-rendering:pixelated}a{color:#9ed8ff}.caption{font-size:13px;color:#ccd7e2}
</style>
<header><h1>Monster attacks — facing the player team ←</h1><button id="play">Pause</button><label>Frame <input id="frame" type="range" min="0" max="11" value="0"><span id="number">1 / 12</span></label><p class="caption">Wind-up → release → strike → recovery. Drag the slider to inspect each pose. Open a battle capture to check the actual game view.</p></header><main id="cards"></main>
<script>
const groups={Bandits:['bandit_cutthroat','bandit_archer','bandit_captain'],Goblins:['goblin','goblin_scout','goblin_archer','goblin_trapper','goblin_skirmisher','goblin_shaman','hobgoblin_guard','goblin_warlord','goblin_king'],Orcs:['orc','orc_raider','orc_berserker','orc_shaman','orc_shieldbearer'],Beasts:['sheep','doe','crystal_hare','mountain_goat','wolf','stag','moss_stag','frost_wolf','snow_lynx','bramble_boar','stoneback_goat','ember_tortoise']};
for(const [group,names] of Object.entries(groups))for(const name of names){const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="caption">${group}</div><strong>${name.replaceAll('_',' ')}</strong><div class="sprite" style="background-image:url('../../../assets/characters/monsters/animations/${name}_attack_anim.png')"></div><a href="battle-${name}.png">Battle capture</a>`;document.querySelector('#cards').append(card)}
let frame=0,playing=true;const slider=document.querySelector('#frame'),button=document.querySelector('#play');function draw(){document.querySelectorAll('.sprite').forEach(e=>e.style.backgroundPosition=`${-frame*256}px 0`);slider.value=frame;document.querySelector('#number').textContent=`${frame+1} / 12`;}button.onclick=()=>{playing=!playing;button.textContent=playing?'Pause':'Play'};slider.oninput=()=>{playing=false;button.textContent='Play';frame=+slider.value;draw()};setInterval(()=>{if(playing){frame=(frame+1)%12;draw()}},130);draw();
</script></html>
